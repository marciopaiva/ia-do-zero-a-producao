name: 📘 Build eBook

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: 🎨 Gerar capa simples (se não existir)
        run: |
          if [ ! -f "src/assets/capa.png" ]; then
            mkdir -p src/assets
            convert -size 1600x2400 xc:'#2563eb' \
              -gravity center -pointsize 48 -fill white \
              -annotate 0 "IA:\nDo Zero à Produção" \
              src/assets/capa.png 2>/dev/null || echo "⚠️ ImageMagick não instalado, pulando capa"
          fi

      - name: 📚 Renderizar eBook
        run: |
          quarto render src/

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebook-output
          path: output/
          retention-days: 30

      - name: 🚀 Deploy GitHub Pages (apenas em main)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ../output
          force_orphan: true

      - name: 🏷️ Criar Release (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true
          draft: false